<!--
편집 규약 (HTML 소스 전용, 화면에는 표시되지 않음)
이 파일의 trip-data JSON에 여행 정보를 채운다. CSS, SVG, 카드·일별 template과 연결 코드는 유지한다.
빈 문자열, null, —는 미입력 값이다. 사실을 확인할 수 없으면 빈 값으로 남긴다.
기존 개인정보·여행 이력은 들어 있지 않다. 이 설명을 화면의 안내문·배지로 옮기지 않는다.

장소 places[장소 ID]
  name: 표시 이름. jp: 현지어 표기. address: 주소. phone: 전화번호.
  query: Google Maps 검색어 (정확한 시설명 + 도시/주소). 표시 이름만으로 자동 검색하지 않는다.
  googlePlaceId: 확인한 Google Place ID (선택). query와 함께 검색 및 길찾기에 사용한다.
  mapUrl: 확인한 장소 지도 URL (Google Maps 공유 링크 포함). 채우면 query보다 우선한다.
  officialUrl: 해당 장소의 공식 홈페이지. 지도 URL이나 예약 URL과 구분한다.

일정 events[일정 ID]
  at: 방문 장소 ID. from / to: 이동 출발 / 도착 장소 ID. 문자열 주소가 아닌 places의 키.
  kind: walk, rail, bus, boat, cable, flight, taxi, meal, visit, wake, sleep, wait, prep, checkin, home, plain.
  travelMode: walking / transit / driving / bicycling 중 하나. 빈 값이면 walk는 walking,
    taxi는 driving, rail/bus/cable/home은 transit. 항공·선박은 확인한 routeUrl을 넣는다.
  routeUrl: 확인한 실제 이동 경로 URL. 있으면 자동 길찾기보다 우선한다.
  도보/대중교통 경로 자동 생성: from/to 장소의 query 또는 address를 모두 채운다.
    편명 serviceId가 연결된 경우 services의 from/to를 대신 사용할 수 있다.
    한쪽 출발·도착이 빠지면 이동 경로 버튼은 비활성 상태로 남긴다.
  officialUrl: 일정의 공식 안내. bookingUrl: 예약 페이지. sourceId: sources의 키.
  links: 추가 링크를 ["버튼 이름", "https://..."] 배열로 넣는다. 빈 URL은 비활성 버튼이 된다.
  title/instructions/carry/ticket/caution: 일정명/진행 내용/준비물/이용권/주의사항.
  meal.menu/hours/reservation/queue/backup: 메뉴/영업시간/예약 조건/대기 한도/대안.

교통 services[교통편 ID]
  from/to: places의 키. title: 편명. board: 승차 위치·승강장. ticket: 승차권 조건.
  officialUrl/bookingUrl: 운영사 공식 안내/예매 페이지. sourceId: sources의 키.
  bookingId: bookings의 키. 해당 예약의 number/seat/status/url을 상세창에 연결한다.
  timetableId: timetables의 키. rows는 [출발 HH:MM, 도착 HH:MM, 편명, 안내] 배열.
  timetables.url: 원본 시간표 URL. cutoffReason: 일정을 유지할 수 있는 최후편 기준.
  sources는 {"source-001":{"title":"자료명","url":"https://..."}} 형태로 추가한다.

날짜 days[] 및 숙소 hotels[]
  n: 1부터 시작하는 순서. date: YYYY-MM-DD. weekday: 요일. from/to: 제목용 지역명.
  base와 variants.*.fullSteps: {id: events의 키, start/end/leave: HH:MM 또는 미입력} 목록.
  variants의 trigger/summary: 대안 전환 조건/요약. 연결 ID를 바꾸면 참조도 함께 바꾼다.
  hotelId: hotels의 키. hotelPlace: places의 키. mapUrl: 하루 전체 동선 지도 URL (선택).
  hotels: name/placeId/address/checkIn/checkOut/bookingNumber/phone/breakfast/officialUrl/bookingUrl.
  weather.tenkiUrl/accuUrl/operatorUrl: 예보 출처 1/2 및 운행·운영 안내 URL.
  title/period/passName: 여행 정보 창의 여행명/기간/교통권.

렌더링 연결
  장소 지도 = mapPlace. 이동 경로 = mapRoute. 공식·예약·추가 링크 = resourceLinks.
  카드와 상세창이 같은 링크 함수를 쓴다. 숙소와 날씨 URL도 각각의 상세창에서 연결된다.
  구글맵 장소·이동 경로·공식 안내·예약 버튼은 URL이 비어도 비활성 상태로 남긴다.
  http/https만 연결하며 임의의 예시 주소나 javascript:를 넣지 않는다.
  JSON 문자열에 따옴표·개행은 JSON 규칙대로 이스케이프하고, 닫는 script 태그는 <\/script>로 적는다.

   const p=node.querySelector('.copy p,.spot-card p');p.textContent=e.instructions||'';p.hidden=!e.instructions;
   const kicker=node.querySelector('.row-kicker');if(kicker)kicker.textContent=kinds[e.kind]||'진행';
   if(isVisit){card.classList.toggle('garden-card',!!e.scenery);node.querySelector('.spot-label').innerHTML=(card.classList.contains('garden-card')?'SCENERY':'EXPERIENCE')+'<span class="tag">'+(s.start==='—'?'—':s.end?mm(s.end)-mm(s.start):'')+'분</span>';}
   const extras=document.createElement('div');extras.className='event-facts';extras.innerHTML=(e.carry?'<p><b>지참</b> '+E(e.carry)+'</p>':'')+(e.ticket?'<p><b>표</b> '+E(e.ticket)+'</p>':'')+morning(e);if(extras.innerHTML)p.after(extras);
 }

 const cutoff=node.querySelector('.cutoff'),point=e.flexible?null:(s.leave||s.end);

function observe(){
 observer?.disconnect();if(observe.bound)return;observe.bound=true;let queued=false;
 window.addEventListener('scroll',()=>{if(queued||$('modal').open)return;queued=true;requestAnimationFrame(()=>{queued=false;const edge=document.querySelector('.top-nav').getBoundingClientRect().bottom+26;let n=1;document.querySelectorAll('.day').forEach(el=>{if(el.getBoundingClientRect().top<=edge)n=Number(el.dataset.day);});if(n!==current){current=n;nav();}});},{passive:true});
}
function render(){$('journey').innerHTML=D.days.map(renderDay).join('');observe();nav();}
function nav(){document.querySelectorAll('[data-go]').forEach(a=>a.setAttribute('aria-current',Number(a.dataset.go)===current?'date':'false'));$('counter').textContent=String(current).padStart(2,'0')+' / 10';$('prev').disabled=current===1;$('next').disabled=current===10;}
function go(n){current=Math.max(1,Math.min(10,n));const el=$('day'+current),bar=document.querySelector('.top-nav');window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-bar.getBoundingClientRect().height-10,behavior:'instant'});history.replaceState(null,'','#day'+current);nav();const active=document.querySelector('[data-go="'+current+'"]'),strip=active.parentElement;strip.scrollTo({left:active.offsetLeft-strip.offsetLeft-(strip.clientWidth-active.clientWidth)/2,behavior:'instant'});}
function setMode(n,k){const old=$('day'+n),anchor=[...old.querySelectorAll('.step')].find(el=>el.getBoundingClientRect().bottom>90),oldTop=anchor?.getBoundingClientRect().top,oldId=anchor?.dataset.event,oldStart=anchor?.dataset.start;modes[n]=k;store();old.outerHTML=renderDay(D.days[n-1]);observe();current=n;nav();const now=$('day'+n);let target=oldId?now.querySelector('[data-event="'+oldId+'"]'):null;if(!target&&oldStart)target=[...now.querySelectorAll('.step')].find(el=>el.dataset.start>=oldStart);if(target&&oldTop!==undefined)window.scrollBy({top:target.getBoundingClientRect().top-oldTop,behavior:'instant'});else now.scrollIntoView({block:'start',behavior:'instant'});toast(k==='base'?'기준 일정':k==='better'?'날씨 호전안':k==='closed'?'운휴·취소안':'비·바람 증가안');}
function show(title,sub,html,tabbed=false){
 const opening=!$('modal').open;
 if(opening){lastFocus=document.activeElement;show.scroll=window.scrollY;document.body.classList.add('dialog-open');document.body.style.top=-show.scroll+'px';}
 $('mtitle').textContent=title;$('msub').textContent=sub||'';$('mbody').innerHTML=html;$('tabs').hidden=!tabbed;
 if(opening)$('modal').showModal();$('mbody').scrollTop=0;
}
let current=1,modes={},done={},lastFocus=null,active=null,observer=null;
const P=id=>D.places[id]||{name:'장소명',jp:'',query:''},src=id=>D.sources[id],svc=e=>D.services[e.serviceId];
const valid=u=>/^https?:\/\//.test(u||''),link=(u,t,cls='action',icon='i-globe')=>valid(u)?'<a class="'+cls+'" href="'+E(u)+'" target="_blank" rel="noopener noreferrer">'+I(icon)+E(t)+'</a>':'';
// Empty destinations retain disabled buttons, so the required wiring is visible.
const linkSlot=(u,t,cls='action',icon='i-globe')=>link(u,t,cls,icon)||'<button type="button" class="'+cls+'" disabled aria-disabled="true">'+I(icon)+E(t)+'</button>';
const mapPlace=id=>{const p=P(id);if(valid(p.mapUrl))return p.mapUrl;const q=p.query||p.address;if(!q)return '';const params=new URLSearchParams({api:'1',query:q});if(p.googlePlaceId)params.set('query_place_id',p.googlePlaceId);return 'https://www.google.com/maps/search/?'+params;};
const routeMode=e=>['walking','transit','driving','bicycling'].includes(e.travelMode)?e.travelMode:({walk:'walking',taxi:'driving',rail:'transit',bus:'transit',cable:'transit',home:'transit'}[e.kind]||'');
function mapRoute(e){if(valid(e.routeUrl))return e.routeUrl;const t=svc(e),from=P(e.from||t?.from),to=P(e.to||t?.to),origin=from.query||from.address,destination=to.query||to.address,mode=routeMode(e);if(!origin||!destination||!mode)return '';const q=new URLSearchParams({api:'1',origin,destination,travelmode:mode});if(from.googlePlaceId)q.set('origin_place_id',from.googlePlaceId);if(to.googlePlaceId)q.set('destination_place_id',to.googlePlaceId);return 'https://www.google.com/maps/dir/?'+q;}
function mapLinks(e){const t=svc(e),place=e.at||e.to||t?.to,travel=!!t||!!e.from||!!e.to||['walk','home','taxi'].includes(e.kind);return linkSlot(mapPlace(place),'구글맵 장소','action map','i-pin')+(travel?linkSlot(mapRoute(e),'이동 경로','action map','i-map'):'');}
function resourceLinks(e){const t=svc(e),p=P(e.at||e.to||t?.to),b=D.bookings[t?.bookingId],official=e.officialUrl||t?.officialUrl||p.officialUrl||src(e.sourceId||t?.sourceId)?.url,booking=e.bookingUrl||t?.bookingUrl||b?.url;let h='';if(t||['visit','meal','checkin'].includes(e.kind)||official)h+=linkSlot(official,'공식 안내','action ghost');if(t||['visit','checkin'].includes(e.kind)||booking)h+=linkSlot(booking,'예약','action ghost','i-ticket');h+=(e.links||[]).map(([label,url])=>linkSlot(url,label,'action ghost')).join('');return h;}
const steps=(n,mode=modes[n]||'base')=>weatherSteps48(n,mode);
const seqEvent=(n,id)=>{const a=steps(n),i=a.findIndex(x=>x.id===id);return i<0?null:{d:D.days[n-1],step:a[i],e:D.events[id],next:a[i+1]||null}};
const store=()=>{};
const morning=()=>'',encounterProposal=()=>'';
const fact=(a,b)=>'<dt>'+E(a)+'</dt><dd>'+E(b||'—')+'</dd>';
function buttons(e,n){return mapLinks(e)+resourceLinks(e)+'<button class="action '+(e.serviceId?'primary':'ghost')+'" data-detail="'+e.id+'" data-day="'+n+'">'+I(e.serviceId?'i-clock':'i-info')+(e.serviceId?'시간표':'상세')+'</button>';}
function baselineContract(d){const w=d.weather;return '<section class="baseline-contract"><div class="contract-heading">날씨</div><p class="contract-assumption">'+E(w.base)+'</p><p class="contract-judgment"><b>실행 조건</b> '+E(w.judge)+'</p><p class="contract-switch"><b>전환 조건</b> '+E(w.down)+'</p><details class="contract-forecast"><summary>예보 · 판단 시각</summary><div><p><b>예보</b> '+E(w.tenki)+'</p><p><b>호전 조건</b> '+E(w.up)+'</p><p><b>확인 시각</b> '+E(w.check)+'</p></div></details></section>';}
function renderDay(d){
 const m=modes[d.n]||'base',v=d.variants[m],node=$('tpl-day-'+d.n).content.firstElementChild.cloneNode(true);node.classList.add('day');

 const bar=node.querySelector('.plan-bar');
 for(const button of bar.querySelectorAll('button')){const key=button.dataset.plan==='main'?'base':button.dataset.plan;button.removeAttribute('data-plan');button.dataset.mode=key;button.dataset.day=d.n;button.classList.toggle('active',key===m);button.setAttribute('aria-pressed',key===m);button.textContent={base:'기준 일정',better:'날씨 호전',worse:'비·바람 증가'}[key];}
 if(['worse','closed'].includes(m)&&d.variants.closed){const options=document.createElement('div');options.className='severity';options.innerHTML='<span>운영 상태</span><button data-mode="worse" data-day="'+d.n+'">정상 운영</button><button data-mode="closed" data-day="'+d.n+'">운휴·취소</button>';bar.after(options);}
 node.querySelector('.head-flow .ko').textContent='';node.querySelector('.plan-brief b').textContent=v?'전환 조건':'오늘 동선';node.querySelector('.plan-brief span').textContent=v?.trigger||d.focus;
 node.querySelector('.timeline').innerHTML=steps(d.n).map(s=>card(s,d.n)).join('');node.querySelector('.page-footer>span:first-child').textContent=d.hotel;return node.outerHTML;

function detail(id,n){const a=seqEvent(n,id);if(!a)return;const{e,step:s,d}=a,t=svc(e);let h='';
 if(t){const rows=D.timetables[t.timetableId]?.rows||[['—','—','편명','—']];h='<div class="r52-ride-head"><span class="r52-route">'+E(P(t.from).name)+' → '+E(P(t.to).name)+'</span><span class="r52-date">'+E(d.date||'MM.DD')+'</span></div><div class="r52-ride-facts"><p><b>승차</b> '+E(t.board)+'</p><p><b>승차권</b> '+E(t.ticket)+'</p></div><div class="r52-board-heading"><b>시간표</b></div><div class="r52-board-wrap"><table class="r52-board"><thead><tr><th>출발</th><th>도착</th><th>편명 · 안내</th></tr></thead><tbody>'+rows.map(r=>'<tr><td>'+E(r[0])+'</td><td>'+E(r[1])+'</td><td>'+E(r[2])+'<small>'+E(r[3])+'</small></td></tr>').join('')+'</tbody></table></div><p class="r52-cutoff-reason"><b>최후편 기준</b> '+E(t.cutoffReason||'—')+'</p>';
 }else{h='<div class="time-range">'+E(s.start)+' → '+E(s.end||'—')+'</div><dl class="facts">'+fact('장소',P(e.at).name)+fact('출발',P(e.from).name)+fact('도착',P(e.to).name)+fact('종료 시각',s.leave)+fact('지참',e.carry)+fact('입장·표',e.ticket)+'</dl><p>'+E(e.instructions)+'</p>';}
 if(t){const b=D.bookings[t.bookingId];if(b)h+='<dl class="facts">'+fact('예약번호',b.number)+fact('좌석',b.seat)+fact('예약 상태',b.status)+'</dl>';h+='<div class="links">'+linkSlot(D.timetables[t.timetableId]?.url,'원본 시간표','action ghost','i-clock')+'</div>';}
 h+='<div class="links">'+mapLinks(e)+resourceLinks(e)+'</div>';

function hotelDetails(n){const d=D.days[n-1],h=D.hotels.find(h=>h.id===d.hotelId)||{},p=P(h.placeId||d.hotelPlace);show(h.name||d.hotel,'','<dl class="facts">'+fact('숙소명',h.name)+fact('주소',h.address||p.address)+fact('체크인',h.checkIn)+fact('체크아웃',h.checkOut)+fact('예약번호',h.bookingNumber)+fact('연락처',h.phone||p.phone)+fact('조식',h.breakfast)+'</dl><div class="links">'+linkSlot(mapPlace(h.placeId||d.hotelPlace),'구글맵 장소','action map','i-pin')+linkSlot(h.officialUrl||p.officialUrl,'공식 안내','action ghost')+linkSlot(h.bookingUrl,'예약','action ghost','i-ticket')+'</div>');}

document.addEventListener('click',e=>{
 const b=e.target.closest('button,a');if(!b)return;
 if(b.dataset.go){e.preventDefault();go(Number(b.dataset.go));}
 else if(b.dataset.mode)setMode(Number(b.dataset.day),b.dataset.mode);
 else if(b.dataset.detail)detail(b.dataset.detail,Number(b.dataset.day));
 else if(b.dataset.done){done[b.dataset.done]=!done[b.dataset.done];const s=b.closest('.step');s.classList.toggle('complete',!!done[b.dataset.done]);b.setAttribute('aria-pressed',!!done[b.dataset.done]);}
